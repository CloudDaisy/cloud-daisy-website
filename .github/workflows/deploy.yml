name: Deploy Cloud Daisy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954976315208:role/gha-deploy-cloud-daisy-website
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false
        env:
          TF_VAR_origin_verify_secret: ${{ secrets.ORIGIN_VERIFY_SECRET }}

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954976315208:role/gha-deploy-cloud-daisy-website
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_origin_verify_secret: ${{ secrets.ORIGIN_VERIFY_SECRET }}

      - name: Sync site files to S3
        run: aws s3 sync . s3://cloud-daisy-website-prod --delete --exclude "terraform/*" --exclude ".git/*" --exclude ".github/*"

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id E3N25O4X75RS7J --paths "/*"